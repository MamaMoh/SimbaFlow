<!doctype html>
<!--
  The LMIS Create Contract dialog, rebuilt from a screenshot of it: labels printed as plain text
  above each box with nothing tying the two together, native date boxes, and Employer city as a
  dropdown widget of LMIS's own rather than a <select>. Invented values only.
-->
<html>
<head>
<meta charset="utf-8">
<title>LMIS — Create Contract</title>
<style>
  body { font: 13px system-ui, sans-serif; background: #e5e7eb; margin: 0; padding: 24px; }
  .dialog { background: #fff; border-radius: 12px; max-width: 480px; margin: 0 auto; padding: 24px; }
  .who { text-align: center; color: #0f5c5c; font-weight: 600; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field p { margin: 0 0 4px; font-size: 12px; color: #374151; }
  .field input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #0f5c5c;
                 border-radius: 4px; font: inherit; }
  .wide { grid-column: 1 / -1; }
  .city { position: relative; }
  .city input { background: #e6f2ef; }
  button { display: block; margin: 18px auto 0; background: #0f5c5c; color: #fff; border: 0;
           border-radius: 6px; padding: 9px 18px; font: inherit; }
</style>
</head>
<body>
<div class="dialog">
  <div class="who">Invented Labourer · Labor ID LB000001</div>
  <div class="grid">
    <div class="field"><p>Beginning of Contract</p><input type="date"></div>
    <div class="field"><p>Ending of Contract</p><input type="date"></div>
    <div class="field"><p>Passport Number</p><input placeholder="passport number"></div>
    <div class="field"><p>Visa Number</p><input placeholder="visa number"></div>
    <div class="field"><p>Employer city</p>
      <div class="city"><input role="combobox" aria-autocomplete="list" readonly></div></div>
    <div class="field"><p>Employer Full Name</p><input placeholder="Employer Name"></div>
    <div class="field"><p>Employer Phone number</p><input placeholder="Employer phone number"></div>
    <div class="field"><p>Alternative Phone Number</p><input placeholder="employer alternative phone number"></div>
    <div class="field wide"><p>House Number</p><input placeholder="House Number"></div>
  </div>
  <button type="button">Create Contract</button>
</div>
</body>
</html>
