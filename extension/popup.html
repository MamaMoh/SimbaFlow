<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fill from SimbaFlow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="masthead">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9.6" />
        <path d="M12 2.4a14.5 14.5 0 0 0 0 19.2 14.5 14.5 0 0 0 0-19.2" />
        <path d="M2.4 12h19.2" />
      </svg>
      <div class="titles">
        <span class="brand">SimbaFlow</span>
        <span class="sub" id="form-name">Reading this page…</span>
      </div>
    </header>

    <main>
      <!-- Nothing to fill here, or nobody signed in. -->
      <section id="state-empty" class="empty stack" hidden>
        <svg id="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M7 9h10M7 13h6" />
        </svg>
        <p class="empty-title" id="empty-title"></p>
        <p class="hint" id="empty-detail"></p>
        <button id="empty-action" class="btn btn-primary" type="button" hidden></button>
      </section>

      <!-- Who is this form for. -->
      <section id="state-search" class="stack" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.2-3.2" />
          </svg>
          <input id="search" type="search" placeholder="Name, passport or labour ID"
                 autocomplete="off" spellcheck="false" />
        </div>
        <ul id="results" class="results" role="listbox"></ul>
        <p class="hint" id="search-hint">Type a name, or part of a passport number.</p>
      </section>

      <!-- What will go into the form. -->
      <section id="state-plan" class="stack" hidden>
        <div class="person">
          <span class="avatar" id="initials"></span>
          <div class="who">
            <div class="person-name" id="chosen"></div>
            <div class="person-sub" id="chosen-sub"></div>
          </div>
        </div>

        <div class="chips" id="counts"></div>

        <button id="fill" class="btn btn-primary" type="button">
          <span id="fill-icon" class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v13" /><path d="m7 11 5 5 5-5" /><path d="M5 21h14" />
            </svg>
          </span>
          <span id="fill-label">Fill this form</span>
        </button>

        <p class="hint">
          Nothing is submitted. Check the form, then press its own button yourself.
        </p>

        <div id="outcome"></div>

        <button id="back" class="btn btn-ghost" type="button">Choose somebody else</button>
      </section>

      <!-- Filling on paste, for the site in front of the person. -->
      <section id="paste" class="paste" hidden>
        <label class="paste-row" for="paste-switch">
          <span class="paste-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="2" width="8" height="4" rx="1" />
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
              <path d="m9 14 2 2 4-4" />
            </svg>
          </span>
          <span class="paste-text">
            <span class="paste-title">Fill when I paste here</span>
            <span class="paste-sub" id="paste-sub"></span>
          </span>
          <input id="paste-switch" class="switch" type="checkbox" role="switch" />
        </label>
      </section>

      <p class="hint" id="message"></p>
    </main>

    <footer class="foot">
      <span id="version"></span>
      <div class="foot-links">
        <a id="privacy" href="#" target="_blank" rel="noreferrer noopener">What it can see</a>
        <button id="labels" class="linkish" type="button">Copy page labels</button>
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
